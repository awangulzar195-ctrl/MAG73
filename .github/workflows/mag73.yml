name: MAG73 Super-AI Viral Clipper

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: 'YouTube Video / Live URL or Release Asset URL'
        required: true
        type: string
      input_mode:
        description: 'Mode: scan, render_clip, vod, live, or upload'
        required: false
        default: 'vod'
        type: string
      edit_style:
        description: 'Editing Vibe: auto, aura, funny, drama, clash, clean'
        required: false
        default: 'auto'
        type: string
      custom_prompt:
        description: 'Optional user instruction for AI Director'
        required: false
        default: ''
        type: string
      plugin_config:
        description: 'JSON config for caption_lang, bgm_enabled, sfx_enabled, banner_enabled'
        required: false
        default: '{"caption_lang":"hinglish","bgm_enabled":true,"sfx_enabled":true,"banner_enabled":true}'
        type: string
      clip_spec:
        description: 'JSON spec for single clip in render_clip mode'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  clip-and-edit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout MAG73 Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg & System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fontconfig nodejs

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp requests google-genai

      - name: Load YouTube Cookies
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          python -c '
          import os, re
          raw = os.getenv("YT_COOKIES") or os.getenv("YOUTUBE_COOKIES") or ""
          out = []
          for line in raw.splitlines():
              s = line.strip()
              if not s or s.startswith("#"):
                  out.append(s)
                  continue
              if "\t" not in s:
                  parts = re.split(r"\s+", s, maxsplit=6)
                  if len(parts) == 7:
                      s = "\t".join(parts)
              out.append(s)
          text = "\n".join(out).strip()
          if text:
              with open("cookies.txt", "w", encoding="utf-8") as f:
                  f.write(text + "\n")
              print(f"cookies.txt ready ({len(out)} lines)")
          else:
              print("WARNING: No cookies secret found!")
          '

      - name: Run MAG73 Multi-AI Council & Pro Editor
        env:
          SOURCE_URL: ${{ github.event.inputs.source_url }}
          INPUT_MODE: ${{ github.event.inputs.input_mode }}
          EDIT_STYLE: ${{ github.event.inputs.edit_style }}
          CUSTOM_PROMPT: ${{ github.event.inputs.custom_prompt }}
          PLUGIN_CONFIG: ${{ github.event.inputs.plugin_config }}
          CLIP_SPEC: ${{ github.event.inputs.clip_spec }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python main.py

      - name: Publish Scan Results (Scan Mode)
        if: ${{ github.event.inputs.input_mode == 'scan' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: scan-${{ github.run_number }}
          name: MAG73 Scan #${{ github.run_number }}
          files: output_clips/scan_result.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Clips to GitHub Release (For App Direct Access)
        if: ${{ github.event.inputs.input_mode != 'scan' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: clips-${{ github.run_number }}
          name: MAG73 Clips #${{ github.run_number }}
          files: output_clips/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
